
upstream quiz_service_backend {
    server livequiz-quizservice-backend-1:8080;
    server livequiz-quizservice-backend-2:8080;
}

server {
    listen 8080;

    location / {
        proxy_pass http://quiz_service_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}